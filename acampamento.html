<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Acampamento - App Mobile Blindado com Escala</title>

    <style>
        :root {
            --slot-curar-y: 44%;     --slot-curar-x: 9%;
            --slot-preparar-y: 67%;  --slot-preparar-x: 9%;
            --slot-lenha1-y: 36%;    --slot-lenha1-x: 84%;
            --slot-lenha2-y: 54%;    --slot-lenha2-x: 84%;
            --slot-lenha3-y: 71%;    --slot-lenha3-x: 84%;
        }

        /* ESTRUTURA BASE DO APP */
        body {
            background-color: #000; color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; width: 100vw;
            overflow: hidden; 
            user-select: none;
        }

        /* O CONTAINER DO JOGO */
        #game-container {
            position: relative;
            background-color: #1a1a24;
            display: flex; flex-direction: column;
            width: 100vw;
            height: calc(100vw * (2340 / 1080));
            max-height: 100vh;
            max-width: calc(100vh * (1080 / 2340));
            box-shadow: 0 0 30px rgba(0,0,0,1); 
        }

        /* FAIXA DE SEGURANÇA (NOTCH) */
        #notch-safe-area {
            width: 100%;
            height: 5.04%; 
            background-color: #000;
            flex-shrink: 0;
        }

        /* TELA DO ACAMPAMENTO */
        #camp-screen {
            position: relative; width: 100%; 
            aspect-ratio: 2480 / 1748; 
            background-image: url('imagens/acampamento.png'); background-color: #2b364a; 
            background-size: 100% 100%; background-repeat: no-repeat;
            border-bottom: 2px solid #111;
            flex-shrink: 0; 
        }

        .slot {
            position: absolute; width: 6.5%; height: 9%;
            border: 2px dashed rgba(255, 255, 255, 0.4); border-radius: 8px;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: background 0.2s, border 0.2s; z-index: 10;
        }
        .slot:hover { background: rgba(255, 255, 255, 0.1); border-color: #ffd700; }

        #dice-box {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            z-index: 20; pointer-events: none;
        }
        #dice-box canvas { width: 100% !important; height: 100% !important; display: block; outline: none; }

        /* PAINEL DOS HERÓIS */
        #ui-panel {
            width: 100%;
            flex-grow: 1; 
            padding: 8px;
            box-sizing: border-box;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .hero-col {
            display: flex; flex-direction: column;
            background: #242533;
            border: 2px solid #3a3b4c;
            border-radius: 4px;
            overflow: hidden;
            container-type: inline-size;
        }

        /* BANDEJA DE DADOS */
        .dice-pool {
            flex-basis: 35%; 
            background: #1a1a24;
            border-bottom: 2px solid #3a3b4c;
            display: flex; flex-direction: column;
            align-items: center; justify-content: flex-start;
            gap: 12px; /* Aumentei o espaço entre os dados maiores */
            padding: 10px;
            overflow-y: auto;
        }

        /* IMAGEM DO HERÓI */
        .hero-img {
            flex-grow: 1;
            background-size: cover;
            background-position: top center;
            background-repeat: no-repeat;
        }

        /* ==========================================================
           NOVA ESCALA - TAMANHO DOBRADO
           ========================================================== */
        .btn-roll {
            border: none; cursor: pointer; text-align: center;
            transition: filter 0.2s; border-top: 2px solid rgba(255,255,255,0.2);
            text-transform: uppercase; font-weight: bold;
            font-family: 'Georgia', serif;
            
            /* DOBRADO: Fonte mínima agora é 24px e o padding é muito mais alto */
            font-size: clamp(24px, 5cqi, 45px); 
            padding: clamp(20px, 3cqh, 40px) clamp(4px, 1cqi, 12px);
        }
        .btn-roll:active { filter: brightness(0.8); }
        .btn-roll:disabled { background: #555 !important; color: #aaa !important; cursor: not-allowed; }

        .btn-knight { background: linear-gradient(to bottom, #d3d3d3, #888); color: #111; text-shadow: 1px 1px 1px rgba(255,255,255,0.8);}
        .btn-cleric { background: linear-gradient(to bottom, #4a90e2, #1c5296); color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.8);}
        .btn-monk   { background: linear-gradient(to bottom, #e6c229, #99801a); color: #111; text-shadow: 1px 1px 1px rgba(255,255,255,0.8);}
        .btn-rogue  { background: linear-gradient(to bottom, #598b64, #2a4731); color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.8);}

        .die-2d {
            /* DOBRADO: Tamanho mínimo do dado foi de 30px para 60px */
            width: clamp(60px, 45cqi, 110px); 
            height: clamp(60px, 45cqi, 110px);
            
            position: relative; cursor: pointer; transition: transform 0.2s;
            filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.6));
            animation: fadeIn 0.3s ease forwards;
            display: flex; align-items: center; justify-content: center;
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: scale(1); } }
        .die-2d.selected { transform: scale(1.15) translateX(-3px); filter: drop-shadow(0px 8px 12px rgba(255, 215, 0, 0.9)); }
        .die-2d.selected svg polygon[fill="#2b364a"] { fill: #ffd700 !important; }
        .die-2d.selected svg text { fill: #111 !important; }
        
        /* Dentro da fogueira eles reduzem proporcionalmente */
        .slot .die-2d { width: 85%; height: 85%; transform: none; animation: none; filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.8));}
    </style>
</head>
<body>

    <div id="game-container">
        <div id="notch-safe-area"></div>

        <div id="camp-screen">
            <div class="slot" style="top: var(--slot-curar-y); left: var(--slot-curar-x);" onclick="allocateDie(this)"></div>
            <div class="slot" style="top: var(--slot-preparar-y); left: var(--slot-preparar-x);" onclick="allocateDie(this)"></div>
            <div class="slot" style="top: var(--slot-lenha1-y); left: var(--slot-lenha1-x);" onclick="allocateDie(this)"></div>
            <div class="slot" style="top: var(--slot-lenha2-y); left: var(--slot-lenha2-x);" onclick="allocateDie(this)"></div>
            <div class="slot" style="top: var(--slot-lenha3-y); left: var(--slot-lenha3-x);" onclick="allocateDie(this)"></div>
            <div id="dice-box"></div>
        </div>

        <div id="ui-panel">
            <div class="hero-col">
                <div class="dice-pool" id="pool-knight"></div>
                <div class="hero-img" style="background-image: url('imagens/cavaleiiro.png');"></div>
                <button class="btn-roll btn-knight" onclick="rollHero('3d10', 'pool-knight')">Rolar</button>
            </div>
            <div class="hero-col">
                <div class="dice-pool" id="pool-cleric"></div>
                <div class="hero-img" style="background-image: url('imagens/clerigo.png');"></div>
                <button class="btn-roll btn-cleric" onclick="rollHero('3d6', 'pool-cleric')">Rolar</button>
            </div>
            <div class="hero-col">
                <div class="dice-pool" id="pool-monk"></div>
                <div class="hero-img" style="background-image: url('imagens/monge.png');"></div>
                <button class="btn-roll btn-monk" onclick="rollHero('3d12', 'pool-monk')">Rolar</button>
            </div>
            <div class="hero-col">
                <div class="dice-pool" id="pool-rogue"></div>
                <div class="hero-img" style="background-image: url('imagens/ladino.png');"></div>
                <button class="btn-roll btn-rogue" onclick="rollHero('3d8', 'pool-rogue')">Rolar</button>
            </div>
        </div>
    </div>

    <script type="module">
        import DiceBox from "/dice-box/dice-box.es.min.js";

        let selectedDie = null;
        const canvasContainer = document.getElementById('dice-box');
        canvasContainer.style.transition = 'opacity 0.5s ease';

        function getResponsiveScale() { return window.innerWidth <= 768 ? 9 : 14; }

        const Box = new DiceBox({
            container: "#dice-box", 
            assetPath: "/dice-box/assets/", 
            theme: "default", themeColor: "#2b3954", 
            scale: getResponsiveScale(), spinForce: 7, throwForce: 7, startingHeight: 12, settleTimeout: 4000
        });

        document.querySelectorAll('#ui-panel button').forEach(b => b.disabled = true);

        Box.init().then(() => {
            window.dispatchEvent(new Event('resize'));
            setTimeout(() => {
                document.querySelectorAll('#ui-panel button').forEach(b => b.disabled = false);
            }, 500);
        }).catch(e => console.error(e));

        function getGeometricDieSVG(sides, value) {
            let polygons = ''; let textY = 60; let textX = 50;
            if (sides == 12) {
                textY = 62; 
                polygons = `
                    <polygon points="50,12 50,2 22,11 4,35 14,38" fill="#7a8b9f" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
                    <polygon points="50,12 86,38 96,35 78,11 50,2" fill="#6a7b8e" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
                    <polygon points="28,82 14,38 4,35 4,65 22,89" fill="#5c6d83" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
                    <polygon points="86,38 72,82 78,89 96,65 96,35" fill="#4d5e71" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
                    <polygon points="72,82 28,82 22,89 50,98 78,89" fill="#3c4c61" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
                    <polygon points="50,12 86,38 72,82 28,82 14,38" fill="#2d3a4f" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
                `;
            } else if (sides == 10) {
                textY = 60; 
                polygons = `
                    <polygon points="50,4 6,58 24,62 50,18" fill="#78869c" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
                    <polygon points="50,4 50,18 76,62 94,58" fill="#67768c" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
                    <polygon points="6,58 50,96 50,80 24,62" fill="#5d6b82" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
                    <polygon points="94,58 76,62 50,80 50,96" fill="#4c5b70" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
                    <polygon points="50,18 76,62 50,80 24,62" fill="#2b364a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
                `;
            } else if (sides == 8) {
                textY = 63; 
                polygons = `
                    <polygon points="50,2 4,38 12,78" fill="#7d8ea5" stroke="#ffffff" stroke-width="5.5" stroke-linejoin="round"/>
                    <polygon points="50,2 96,38 88,78" fill="#4a5a75" stroke="#ffffff" stroke-width="5.5" stroke-linejoin="round"/>
                    <polygon points="12,78 50,98 88,78" fill="#5a6a85" stroke="#ffffff" stroke-width="5.5" stroke-linejoin="round"/>
                    <polygon points="50,2 88,78 12,78" fill="#2d3a4f" stroke="#ffffff" stroke-width="5.5" stroke-linejoin="round"/>
                `;
            } else if (sides == 6) {
                textX = 44; textY = 66; 
                polygons = `
                    <polygon points="22,10 90,10 78,22 10,22" fill="#78869c" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
                    <polygon points="78,22 90,10 90,78 78,90" fill="#5d6b82" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
                    <polygon points="10,22 78,22 78,90 10,90" fill="#2b364a" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
                `;
            }
            return `
                <svg viewBox="0 0 100 100" width="100%" height="100%">
                    ${polygons}
                    <text x="${textX}" y="${textY}" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#f7e1b5" text-anchor="middle">${value}</text>
                </svg>
            `;
        }

        window.rollHero = function(diceCommand, targetPoolId) {
            document.querySelectorAll('#ui-panel button').forEach(b => b.disabled = true);
            selectedDie = null;
            const currentPool = document.getElementById(targetPoolId);
            currentPool.innerHTML = ''; 
            canvasContainer.style.opacity = '1';
            canvasContainer.style.pointerEvents = 'auto';

            Box.roll(diceCommand).then((results) => {
                canvasContainer.style.pointerEvents = 'none';

                setTimeout(() => {
                    canvasContainer.style.opacity = '0'; 
                    let parsedResults = [];
                    const extractRolls = (item) => {
                        if (Array.isArray(item)) item.forEach(extractRolls);
                        else if (item && item.rolls) item.rolls.forEach(extractRolls);
                        else if (item && item.value !== undefined) {
                            let rawSides = item.sides || (item.dieType ? item.dieType.replace('d', '') : null) || (item.groupId ? item.groupId.match(/\d+/)[0] : 6);
                            parsedResults.push({ type: parseInt(rawSides), value: item.value });
                        }
                    };
                    extractRolls(results);
                    
                    parsedResults.forEach(data => {
                        let die = document.createElement('div');
                        die.className = `die-2d`;
                        die.innerHTML = getGeometricDieSVG(data.type, data.value);

                        die.onclick = function(event) {
                            event.stopPropagation(); 
                            if (selectedDie) selectedDie.classList.remove('selected');
                            if (selectedDie === this) { selectedDie = null; return; }
                            selectedDie = this;
                            this.classList.add('selected');
                        };
                        currentPool.appendChild(die);
                    });
                    document.querySelectorAll('#ui-panel button').forEach(b => b.disabled = false);
                }, 800); 
            }).catch(err => {
                console.error(err);
                document.querySelectorAll('#ui-panel button').forEach(b => b.disabled = false);
            });
        };

        window.allocateDie = function(slotElement) {
            if (selectedDie) {
                if (selectedDie.parentNode) selectedDie.parentNode.removeChild(selectedDie);
                if (slotElement.hasChildNodes()) {
                    const oldDie = slotElement.firstChild;
                    document.getElementById('pool-knight').appendChild(oldDie); 
                }
                slotElement.appendChild(selectedDie);
                selectedDie.classList.remove('selected');
                selectedDie = null;
            }
        }
    </script>
</body>
</html>
